<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIO Life · 网页入库</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-play" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="5"/><path d="m10 9 5 3-5 3Z"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"/></symbol>
    <symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></symbol>
    <symbol id="icon-key" viewBox="0 0 24 24"><circle cx="8" cy="9" r="4"/><path d="m11 12 8 8m-4-4 3-3m0 6 3-3"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>

  <main class="popup">
    <header class="header">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="m7 23 9-16 9 16M11 17h10"/><circle cx="24" cy="8" r="2"/></svg></div>
      <div class="brand-copy"><h1>AIO Life</h1></div>
      <span class="platform-badge" id="platform-badge">浏览器助手</span>
    </header>

    <section class="video-card" aria-labelledby="video-title">
      <span class="video-icon"><svg class="icon"><use href="#icon-play"/></svg></span>
      <div class="video-copy"><span class="eyebrow" id="video-label">当前页面</span><h2 id="video-title">正在读取…</h2><p id="video-meta"></p></div>
    </section>

    <section class="tag-section" aria-labelledby="tag-heading">
      <div class="section-heading"><h2 id="tag-heading">标记视频</h2></div>
      <div class="tag-list">
        <button type="button" class="tag-item" data-tag="待看" disabled><span class="tag-icon"><svg class="icon"><use href="#icon-clock"/></svg></span><span class="tag-copy"><strong>待看</strong></span><svg class="icon tag-arrow"><use href="#icon-chevron"/></svg></button>
        <button type="button" class="tag-item" data-tag="已看" disabled><span class="tag-icon"><svg class="icon"><use href="#icon-check"/></svg></span><span class="tag-copy"><strong>已看</strong></span><svg class="icon tag-arrow"><use href="#icon-chevron"/></svg></button>
        <button type="button" class="tag-item" data-tag="学习中" disabled><span class="tag-icon"><svg class="icon"><use href="#icon-book"/></svg></span><span class="tag-copy"><strong>学习中</strong></span><svg class="icon tag-arrow"><use href="#icon-chevron"/></svg></button>
        <button type="button" class="tag-item" data-tag="收藏" disabled><span class="tag-icon"><svg class="icon"><use href="#icon-star"/></svg></span><span class="tag-copy"><strong>收藏</strong></span><svg class="icon tag-arrow"><use href="#icon-chevron"/></svg></button>
      </div>
    </section>

    <section class="capture-section" aria-label="网页采集">
      <button type="button" id="capture-page" class="capture-button" disabled>采集当前页面</button>
    </section>

    <section class="auto-sync-setting" aria-label="豆瓣自动同步">
      <label><input type="checkbox" id="douban-auto-toggle"><span>豆瓣标记自动同步</span></label>
      <p>同步想看、看过；取消标记也会移除观影记录。</p>
      <p id="douban-auto-state" role="status"></p>
    </section>

    <details class="settings" id="auth-settings">
      <summary><svg class="icon"><use href="#icon-key"/></svg><span>连接设置</span><span class="auth-state" id="auth-state">未配置</span><svg class="icon settings-chevron"><use href="#icon-chevron"/></svg></summary>
      <form id="auth-form" class="settings-body">
        <label for="api-base">API 地址（含 /api）</label>
        <div class="token-field"><input type="url" id="api-base" value="https://aiolife.top/api" required spellcheck="false"></div>
        <label for="auth-token">Token</label>
        <div class="token-field"><input type="password" id="auth-token" placeholder="粘贴 Token，留空不变" autocomplete="off" spellcheck="false"><button type="button" id="toggle-auth" class="icon-button" aria-label="显示 Token" aria-pressed="false"><svg class="icon"><use href="#icon-eye"/></svg></button></div>
        <div class="settings-actions"><p>仅保存在当前浏览器</p><button type="button" id="clear-auth" class="icon-button" aria-label="清除已保存 Token" title="清除已保存 Token">×</button><button type="submit" id="save-auth">保存配置</button></div>
      </form>
    </details>

    <footer class="footer"><span class="status-dot" id="status-dot" aria-hidden="true"></span><p id="status" role="status" aria-live="polite"></p></footer>
  </main>
  <script src="capture/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>

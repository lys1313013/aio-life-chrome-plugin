<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIO Life · 入库预览</title><link rel="stylesheet" href="shared/theme.css"><link rel="stylesheet" href="capture.css"></head>
<body>
  <main class="capture-app">
    <header class="capture-header"><div><span class="eyebrow">AIO LIFE · 浏览器助手</span><h1 id="page-title">正在读取…</h1><p id="source-description"></p></div></header>
    <div id="messages" role="status" aria-live="polite"></div>
    <section id="result" hidden class="notice success"></section>
    <section id="warnings" hidden class="notice"></section>
    <form id="capture-form"><div id="editor"></div>
      <footer class="actions"><p id="save-hint"></p><div><button id="remaining-assets" type="button" hidden>录入其余商品</button><button id="edit-saved" type="button" hidden>修改已保存物品</button><button id="preview" type="button" class="secondary">预览与查重</button><button id="commit" type="submit" class="primary" disabled>确认保存</button></div></footer>
    </form>
    <details class="privacy-note"><summary>隐私说明</summary><p>只读取你主动采集的页面字段，不上传 Cookie、收货地址、手机号或整页 HTML。采集内容和未提交修改仅保留在当前页面内存中；刷新或关闭即丢弃。已保存记录从服务器读取。</p></details>
  </main>
  <script src="capture/core.js"></script><script src="capture/ui.js"></script>
</body></html>
